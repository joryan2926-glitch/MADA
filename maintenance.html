<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>MADA - Site temporairement non public</title>
    <meta name="description" content="Le site MADA est temporairement fermé au public pendant sa finalisation.">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: dark; --green: #002b18; --deep: #00170d; --gold: #f4b41a; --white: #f8fbf7; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; overflow-x: hidden; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--white);
        background:
          linear-gradient(135deg, rgba(0, 43, 24, .94), rgba(0, 11, 7, .98)),
          radial-gradient(circle at top right, rgba(244, 180, 26, .18), transparent 36%),
          var(--deep);
      }
      main {
        width: min(720px, 100%);
        border: 1px solid rgba(244, 180, 26, .32);
        background: rgba(0, 23, 13, .78);
        padding: clamp(28px, 5vw, 56px);
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, .34);
      }
      img { width: min(180px, 56vw); height: auto; margin-bottom: 28px; }
      p.kicker { margin: 0 0 12px; color: var(--gold); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: .82rem; }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); line-height: .95; text-transform: uppercase; }
      p { margin: 20px auto 0; max-width: 560px; font-size: clamp(1rem, 2.3vw, 1.2rem); line-height: 1.65; color: rgba(248, 251, 247, .88); }
      .domain { display: inline-block; margin-top: 28px; color: var(--gold); font-weight: 800; }
    </style>
  </head>
  <body>
    <main aria-labelledby="page-title">
      <img src="/assets/logo-mada.png" alt="MADA" onerror="this.style.display='none'">
      <p class="kicker">Accès temporairement fermé</p>
      <h1 id="page-title">Site en finalisation</h1>
      <p>Le site MADA n'est pas consultable publiquement pour le moment. La plateforme est en cours de finalisation avant ouverture officielle.</p>
      <span class="domain">mada-martinique.fr</span>
    </main>
  </body>
</html>
